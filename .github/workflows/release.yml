name: Release

# Push a tag vX.Y.Z whose gradle.properties VERSION_NAME is X.Y.Z (not a -SNAPSHOT).
on:
  push:
    tags: ['v*']

jobs:
  plugin-portal:
    name: Publish to the Gradle Plugin Portal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches VERSION_NAME
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != VERSION_NAME $version"; exit 1; }
      - name: Test
        run: ./gradlew test :gradle-plugin:functionalTest
      - name: Publish
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        # The plugin-publish plugin reads GRADLE_PUBLISH_KEY/SECRET from the environment: no
        # secrets on the command line (process list, configuration cache key).
        run: ./gradlew :gradle-plugin:publishPlugins

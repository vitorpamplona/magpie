name: Test/Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (unit, golden, TestKit; jvm, android, js, wasmJs, linuxX64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless
        run: ./gradlew spotlessCheck
      - name: Unit, golden and gateway tests
        run: ./gradlew test
      - name: TestKit end-to-end
        # ubuntu-latest ships an Android SDK at $ANDROID_HOME.
        run: ./gradlew :gradle-plugin:functionalTest -Pmagpie.kmpTargets=jvm,android,js,wasmJs,linuxX64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-reports
          path: '**/build/reports/tests/'

  macos:
    name: macOS (Apple targets)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test
      - name: TestKit end-to-end
        run: ./gradlew :gradle-plugin:functionalTest -Pmagpie.kmpTargets=jvm,iosSimulatorArm64,macosArm64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-reports
          path: '**/build/reports/tests/'

  gradle-floor:
    name: Oldest supported Gradle (8.8), daemon on JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk17
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The test builds run on Gradle 8.8 with their daemon on JDK 17: the plugin and the
      # resolution engine must load there; the signing worker picks a Java 21 toolchain.
      - run: >-
          ./gradlew :gradle-plugin:functionalTest --tests '*JvmEndToEndTest*'
          -Pmagpie.gradleVersion=8.8
          -Pmagpie.daemonJavaHome=${{ steps.jdk17.outputs.path }}

  gradle-latest-8:
    name: Gradle 8.14 consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :gradle-plugin:functionalTest --tests '*JvmEndToEndTest*' -Pmagpie.gradleVersion=8.14.3

  gateway-image:
    name: Gateway Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: magpie-gateway:ci
